<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - USDT Gateway</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-refresh {
            background: #667eea;
        }

        .btn-export {
            background: #10b981;
        }

        .btn-success {
            background: #10b981;
        }

        .btn-danger {
            background: #ef4444;
        }

        .btn-warning {
            background: #f59e0b;
        }

        .btn-info {
            background: #3b82f6;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.85rem;
        }

        .filter-section {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-section select, .filter-section input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }

        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 700;
            color: #333;
            border-bottom: 2px solid #dee2e6;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: top;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }

        .pending { background: #f59e0b; }
        .verified { background: #10b981; }
        .processing { background: #3b82f6; }
        .completed { background: #8b5cf6; }
        .failed { background: #ef4444; }
        .rejected { background: #6b7280; }

        .bank-details {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .bank-details div {
            margin: 5px 0;
        }

        .bank-details .label {
            font-weight: 600;
            color: #666;
        }

        .tx-hash {
            font-family: monospace;
            font-size: 0.85rem;
            color: #3b82f6;
            word-break: break-all;
            max-width: 120px;
            display: inline-block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .amount {
            font-weight: 700;
            font-size: 1.1rem;
            color: #333;
        }

        .inr-amount {
            font-weight: 700;
            color: #10b981;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            overflow: auto;
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        .copy-btn {
            background: #e0e0e0;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .copy-btn:hover {
            background: #d0d0d0;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
            }
            
            .stats-container {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💼 Admin Dashboard</h1>
            <div class="controls">
                <button onclick="refreshTransactions()" class="btn btn-refresh">🔄 Refresh</button>
                <button onclick="exportToCSV()" class="btn btn-export">📥 Export CSV</button>
            </div>
        </div>

        <div class="stats-container" id="statsContainer">
            <div class="stat-card">
                <h3>Total Deposits Today</h3>
                <div class="value" id="totalDeposits">0</div>
            </div>
            <div class="stat-card">
                <h3>Total USDT Received</h3>
                <div class="value" id="totalUSDT">0</div>
            </div>
            <div class="stat-card">
                <h3>Total INR to Pay</h3>
                <div class="value" id="totalINR">₹0</div>
            </div>
            <div class="stat-card">
                <h3>Pending Verifications</h3>
                <div class="value" id="pendingCount">0</div>
            </div>
        </div>

        <div class="filter-section">
            <label>Filter by Status:</label>
            <select id="statusFilter" onchange="filterTransactions()">
                <option value="all">All</option>
                <option value="pending">Pending</option>
                <option value="verified">Verified</option>
                <option value="processing">Processing</option>
                <option value="completed">Completed</option>
                <option value="failed">Failed</option>
            </select>

            <label>Search:</label>
            <input type="text" id="searchInput" placeholder="Search by TxHash, Email, Phone..." oninput="filterTransactions()">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Transaction</th>
                        <th>Amount</th>
                        <th>User Details</th>
                        <th>Bank Details (For INR Transfer)</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="transactionsBody">
                    <tr>
                        <td colspan="7" class="loading">Loading transactions...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Transaction Details</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001/api';
        const API_KEY = 'mysecretapikey123';
        
        let allTransactions = [];
        let filteredTransactions = [];

        // Load transactions on page load
        document.addEventListener('DOMContentLoaded', () => {
            refreshTransactions();
        });

        async function refreshTransactions() {
            try {
                const response = await fetch(`${API_URL}/admin/transactions`, {
                    headers: { 'X-API-Key': API_KEY }
                });
                const result = await response.json();
                
                if (result.success) {
                    allTransactions = result.data;
                    filteredTransactions = allTransactions;
                    updateStats();
                    displayTransactions(allTransactions);
                } else {
                    showError('Failed to load transactions');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Cannot connect to server');
            }
        }

        function updateStats() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const todayTx = allTransactions.filter(tx => new Date(tx.createdAt) >= today);
            const totalUSDT = todayTx.reduce((sum, tx) => sum + (tx.amount || 0), 0);
            const totalINR = todayTx.reduce((sum, tx) => sum + (tx.amountInINR || 0), 0);
            const pending = allTransactions.filter(tx => 
                tx.status === 'pending' || tx.status === 'verified' || tx.status === 'processing'
            );
            
            document.getElementById('totalDeposits').textContent = todayTx.length;
            document.getElementById('totalUSDT').textContent = totalUSDT.toFixed(2);
            document.getElementById('totalINR').textContent = `₹${totalINR.toFixed(2)}`;
            document.getElementById('pendingCount').textContent = pending.length;
        }

        function displayTransactions(transactions) {
            const tbody = document.getElementById('transactionsBody');
            
            if (!transactions || transactions.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">
                            <div class="icon">📭</div>
                            <h3>No transactions found</h3>
                            <p>Transactions will appear here when users submit deposits</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = '';
            
            transactions.forEach(tx => {
                const row = document.createElement('tr');
                
                // Format date
                const date = new Date(tx.createdAt);
                const dateStr = date.toLocaleString('en-IN', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                // Bank details HTML
                const bankDetails = tx.bankDetails || {};
                const bankHTML = `
                    <div class="bank-details">
                        <div><span class="label">👤 Name:</span> ${bankDetails.accountHolderName || 'N/A'}</div>
                        <div><span class="label">🏦 Bank:</span> ${bankDetails.bankName || 'N/A'}</div>
                        <div><span class="label">🔢 Account:</span> 
                            <span id="acc-${tx._id}">${bankDetails.accountNumber || 'N/A'}</span>
                            <button class="copy-btn" onclick="copyText('acc-${tx._id}')">📋</button>
                        </div>
                        <div><span class="label">🏧 IFSC:</span> 
                            <span id="ifsc-${tx._id}">${bankDetails.ifscCode || 'N/A'}</span>
                            <button class="copy-btn" onclick="copyText('ifsc-${tx._id}')">📋</button>
                        </div>
                    </div>
                `;
                
                row.innerHTML = `
                    <td>${dateStr}</td>
                    <td>
                        <div class="tx-hash" title="${tx.txHash}">
                            ${tx.txHash ? tx.txHash.substring(0, 15) + '...' : 'N/A'}
                        </div>
                        <button class="copy-btn" onclick="copyText('tx-${tx._id}')">📋</button>
                        <span id="tx-${tx._id}" style="display:none">${tx.txHash || ''}</span>
                    </td>
                    <td>
                        <div class="amount">${tx.amount || 0} USDT</div>
                        <div class="inr-amount">₹${(tx.amountInINR || 0).toFixed(2)}</div>
                    </td>
                    <td>
                        <div><strong>${tx.email || 'N/A'}</strong></div>
                        <div>${tx.phone || 'N/A'}</div>
                        <div style="font-size:0.8rem; color:#666;">
                            ${tx.userAddress ? tx.userAddress.substring(0, 10) + '...' : 'N/A'}
                        </div>
                    </td>
                    <td>${bankHTML}</td>
                    <td>
                        <span class="status-badge ${tx.status}">${tx.status.toUpperCase()}</span>
                    </td>
                    <td>
                        ${getActionButtons(tx)}
                        <button class="btn btn-info btn-sm" onclick="viewDetails('${tx._id}')" style="margin-top:5px;">
                            👁️ View
                        </button>
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }

        function getActionButtons(tx) {
            let buttons = '';
            
            switch(tx.status) {
                case 'pending':
                    buttons = `
                        <button class="btn btn-success btn-sm" onclick="updateStatus('${tx._id}', 'verified')">✅ Verify</button>
                        <button class="btn btn-danger btn-sm" onclick="updateStatus('${tx._id}', 'failed')">❌ Fail</button>
                    `;
                    break;
                case 'verified':
                    buttons = `
                        <button class="btn btn-warning btn-sm" onclick="updateStatus('${tx._id}', 'processing')">⏳ Process</button>
                        <button class="btn btn-success btn-sm" onclick="updateStatus('${tx._id}', 'completed')">✅ Complete</button>
                    `;
                    break;
                case 'processing':
                    buttons = `
                        <button class="btn btn-success btn-sm" onclick="updateStatus('${tx._id}', 'completed')">✅ Complete</button>
                    `;
                    break;
                case 'completed':
                    buttons = `<span style="color:#10b981;">✓ Done</span>`;
                    break;
                case 'failed':
                    buttons = `<span style="color:#ef4444;">✗ Failed</span>`;
                    break;
                default:
                    buttons = '';
            }
            
            return buttons;
        }

        async function updateStatus(id, status) {
            if (!confirm(`Are you sure you want to mark this transaction as ${status}?`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/admin/transaction/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': API_KEY
                    },
                    body: JSON.stringify({ status })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert(`✅ Transaction marked as ${status}`);
                    refreshTransactions();
                } else {
                    alert('❌ Failed to update status');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error updating transaction');
            }
        }

        function viewDetails(id) {
            const tx = allTransactions.find(t => t._id === id);
            if (!tx) return;
            
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');
            
            const bank = tx.bankDetails || {};
            
            content.innerHTML = `
                <div style="margin-bottom:20px;">
                    <h3>Transaction Details</h3>
                    <p><strong>Status:</strong> <span class="status-badge ${tx.status}">${tx.status.toUpperCase()}</span></p>
                </div>
                
                <div style="background:#f8f9fa; padding:15px; border-radius:10px; margin-bottom:15px;">
                    <h4>🔗 Blockchain Info</h4>
                    <p><strong>TxHash:</strong><br>${tx.txHash}</p>
                    <p><strong>From:</strong><br>${tx.userAddress}</p>
                    <p><strong>Amount:</strong> ${tx.amount} USDT</p>
                    <p><strong>INR Value:</strong> ₹${(tx.amountInINR || 0).toFixed(2)}</p>
                </div>
                
                <div style="background:#f0f4ff; padding:15px; border-radius:10px; margin-bottom:15px;">
                    <h4>👤 User Details</h4>
                    <p><strong>Email:</strong> ${tx.email}</p>
                    <p><strong>Phone:</strong> ${tx.phone}</p>
                    <p><strong>Submitted:</strong> ${new Date(tx.createdAt).toLocaleString()}</p>
                </div>
                
                <div style="background:#f0fff4; padding:15px; border-radius:10px; margin-bottom:15px;">
                    <h4>🏦 Bank Details (For INR Transfer)</h4>
                    <p><strong>Account Holder:</strong> ${bank.accountHolderName || 'N/A'}</p>
                    <p><strong>Bank Name:</strong> ${bank.bankName || 'N/A'}</p>
                    <p><strong>Account Number:</strong> ${bank.accountNumber || 'N/A'}</p>
                    <p><strong>IFSC Code:</strong> ${bank.ifscCode || 'N/A'}</p>
                </div>
                
                ${tx.notes ? `
                    <div style="background:#fff3cd; padding:15px; border-radius:10px;">
                        <h4>📝 Notes</h4>
                        <p>${tx.notes}</p>
                    </div>
                ` : ''}
                
                <div style="margin-top:20px; text-align:right;">
                    ${getActionButtons(tx)}
                </div>
            `;
            
            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function copyText(elementId) {
            const element = document.getElementById(elementId);
            if (!element) return;
            
            const text = element.textContent || element.value || '';
            
            navigator.clipboard.writeText(text).then(() => {
                alert('📋 Copied to clipboard!');
            }).catch(err => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('📋 Copied!');
            });
        }

        function filterTransactions() {
            const statusFilter = document.getElementById('statusFilter').value;
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            
            filteredTransactions = allTransactions.filter(tx => {
                // Filter by status
                if (statusFilter !== 'all' && tx.status !== statusFilter) {
                    return false;
                }
                
                // Filter by search
                if (searchQuery) {
                    const searchable = [
                        tx.txHash,
                        tx.email,
                        tx.phone,
                        tx.userAddress,
                        tx.bankDetails?.accountHolderName,
                        tx.bankDetails?.accountNumber,
                        tx.bankDetails?.ifscCode,
                        tx.bankDetails?.bankName
                    ].join(' ').toLowerCase();
                    
                    if (!searchable.includes(searchQuery)) {
                        return false;
                    }
                }
                
                return true;
            });
            
            displayTransactions(filteredTransactions);
        }

        function exportToCSV() {
            if (filteredTransactions.length === 0) {
                alert('No transactions to export');
                return;
            }
            
            const headers = [
                'Date',
                'TxHash',
                'Amount (USDT)',
                'Amount (INR)',
                'Email',
                'Phone',
                'Account Holder',
                'Bank Name',
                'Account Number',
                'IFSC Code',
                'Status'
            ];
            
            const rows = filteredTransactions.map(tx => [
                new Date(tx.createdAt).toLocaleString(),
                tx.txHash,
                tx.amount,
                tx.amountInINR,
                tx.email,
                tx.phone,
                tx.bankDetails?.accountHolderName || '',
                tx.bankDetails?.bankName || '',
                tx.bankDetails?.accountNumber || '',
                tx.bankDetails?.ifscCode || '',
                tx.status
            ]);
            
            let csv = headers.join(',') + '\n';
            rows.forEach(row => {
                csv += row.map(cell => `"${cell}"`).join(',') + '\n';
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `transactions_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function showError(message) {
            const tbody = document.getElementById('transactionsBody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" class="empty-state">
                        <div class="icon">⚠️</div>
                        <h3>${message}</h3>
                        <p>Make sure the backend server is running</p>
                    </td>
                </tr>
            `;
        }

        // Close modal on outside click
        window.addEventListener('click', (e) => {
            const modal = document.getElementById('detailModal');
            if (e.target === modal) {
                closeModal();
            }
        });

        // Auto-refresh every 5 minutes
        setInterval(refreshTransactions, 300000);
    </script>
</body>
</html>
